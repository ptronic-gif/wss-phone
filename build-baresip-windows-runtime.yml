name: Build Baresip for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Install dependencies via MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-libsrtp
            git

      - name: Clone libre
        shell: msys2 {0}
        run: git clone --depth 1 https://github.com/baresip/re.git

      - name: Build libre
        shell: msys2 {0}
        run: |
          cmake -S re -B re/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/ucrt64
          cmake --build re/build -j4
          cmake --install re/build

      - name: Clone librem
        shell: msys2 {0}
        run: git clone --depth 1 https://github.com/baresip/rem.git

      - name: Build librem
        shell: msys2 {0}
        run: |
          cmake -S rem -B rem/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/ucrt64
          cmake --build rem/build -j4
          cmake --install rem/build

      - name: Clone baresip
        shell: msys2 {0}
        run: git clone --depth 1 https://github.com/baresip/baresip.git

      - name: Build baresip
        shell: msys2 {0}
        run: |
          cmake -S baresip -B baresip/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/ucrt64 \
            -DMODULES="wasapi;opus;g711;auresamp;auconv;stun;turn;ice;srtp;dtls_srtp;account;menu;ctrl_tcp;natpmp" \
            -DOPENSSL_ROOT_DIR=/ucrt64
          cmake --build baresip/build -j4

      - name: Collect baresip.exe and ALL required DLLs
        shell: msys2 {0}
        run: |
          mkdir -p output
          cp baresip/build/baresip.exe output/
          find baresip/build -name "*.dll" -exec cp {} output/ \;

          echo "=== ldd output ==="
          ldd baresip/build/baresip.exe || true

          ldd baresip/build/baresip.exe \
            | grep '/ucrt64/' \
            | awk '{print $3}' \
            | xargs -I{} cp {} output/ 2>/dev/null || true

          for dll in \
            libssl-3-x64.dll \
            libcrypto-3-x64.dll \
            libopus-0.dll \
            libsrtp2-1.dll \
            zlib1.dll \
            libz-1.dll \
            libre.dll \
            librem.dll \
            libgcc_s_seh-1.dll \
            libwinpthread-1.dll \
            libstdc++-6.dll; do
            cp /ucrt64/bin/$dll output/ 2>/dev/null && echo "Copied $dll" || echo "Not found: $dll"
          done

          cp re/build/libre.dll output/ 2>/dev/null || true
          cp rem/build/librem.dll output/ 2>/dev/null || true

          echo "=== Final output contents ==="
          ls -lh output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: baresip-windows-runtime-webrtc
          path: output/
          retention-days: 30
